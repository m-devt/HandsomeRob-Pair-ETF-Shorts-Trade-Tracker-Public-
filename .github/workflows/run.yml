name: trade_tracker.py

on:
  schedule:
    # Runs Monday through Friday at 21:15 UTC (4:15 PM EST, right after closing bell)
    - cron: '15 21 * * 1-5'
  workflow_dispatch: # Allows you to manually trigger it from the GitHub website anytime

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Strategy Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas yfinance supabase dotenv

    - name: Run Drift Proof Monitor Engine
      env:
        # Securely maps your encrypted GitHub Secrets into the Python running environment
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      run: python trade_tracker.py
